title: Sales Overview
source: dbt_v2_test

variables:
  period:
    input: daterange
    label: Order date
    default: [2016-09-01, 2016-09-16]

queries:
  sales_kpis:
    sql: |
      SELECT
        SUM(order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(order_total) AS average_order_value,
        COUNT(DISTINCT customer_id) AS customers
      FROM DBT_TEST.ORDERS
      WHERE {{ filter_date_range('order_date', period) }}
    formats:
      revenue: currency_whole
      orders: integer
      average_order_value: currency_full
      customers: integer
  daily_sales:
    sql: |
      SELECT
        order_date,
        SUM(order_total) AS revenue,
        COUNT(*) AS orders
      FROM DBT_TEST.ORDERS
      WHERE {{ filter_date_range('order_date', period) }}
      GROUP BY order_date
      ORDER BY order_date
    formats:
      revenue: currency_whole
      orders: integer

charts:
  total_revenue:
    query: sales_kpis
    type: kpi
    value: revenue
    label: Revenue
    style:
      value:
        format: currency_whole
  revenue_trend:
    query: daily_sales
    type: line
    title: Daily Revenue
    x: order_date
    y: revenue
    y_label: Revenue

rows:
  - cols: [total_revenue, revenue_trend]
