title: Sales Detail
notes: Order-level detail opened from the Sales Overview drill-down links.
source: dbt_v2_test

variables:
  selected_date:
    input: text
    label: Selected order date
    default: All
  selected_product:
    input: text
    label: Selected product
    default: All
  order_type:
    input: select
    label: Order type
    options:
      static: [All, Food, Drink, Both]
    default: All

queries:
  order_line_detail:
    sql: |
      SELECT
        o.order_date,
        o.order_id,
        o.customer_id,
        oi.product_name,
        oi.product_price AS item_sales,
        oi.supply_cost,
        oi.product_price - oi.supply_cost AS gross_profit,
        o.order_total,
        o.count_order_items
      FROM DBT_TEST.ORDER_ITEMS oi
      JOIN DBT_TEST.ORDERS o ON oi.order_id = o.order_id
      WHERE (
          '{{ selected_date }}' = 'All'
          OR TO_CHAR(o.order_date, 'YYYY-MM-DD') = '{{ selected_date }}'
        )
        AND (
          '{{ selected_product }}' = 'All'
          OR oi.product_name = '{{ selected_product }}'
        )
        AND (
          '{{ order_type }}' = 'All'
          OR ('{{ order_type }}' = 'Food' AND o.is_food_order)
          OR ('{{ order_type }}' = 'Drink' AND o.is_drink_order)
          OR ('{{ order_type }}' = 'Both' AND o.is_food_order AND o.is_drink_order)
        )
      ORDER BY o.order_date DESC, o.order_id, oi.product_name
    formats:
      item_sales: currency_full
      supply_cost: currency_full
      gross_profit: currency_full
      order_total: currency_full
      count_order_items: integer

charts:
  order_line_table:
    query: order_line_detail
    type: table
    title: Order Line Detail
    style:
      columns:
        order_date:
          label: Order Date
        order_id:
          label: Order ID
          format: id
        customer_id:
          label: Customer ID
          format: id
        product_name:
          label: Product
        item_sales:
          label: Item Sales
          format: currency_full
          align: right
        supply_cost:
          label: Supply Cost
          format: currency_full
          align: right
        gross_profit:
          label: Gross Profit
          format: currency_full
          align: right
        order_total:
          label: Order Total
          format: currency_full
          align: right
        count_order_items:
          label: Items in Order
          format: integer
          align: right

rows:
  - order_line_table
